<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABTD Protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="popup-wrap" id="popup-wrap">

  <!-- Header -->
  <div class="popup-header">
    <div class="logo-row">
      <span class="shield-icon">🛡️</span>
      <div>
        <div class="brand">ABTD v2.0</div>
        <div class="brand-sub">Zero Trust + Adaptive Threat Detection</div>
      </div>
    </div>
    <div class="status-pill" id="conn-status">
      <span class="dot"></span>
      <span id="conn-text">Checking…</span>
    </div>
  </div>

  <!-- Protection Status -->
  <div class="section" id="protection-section">
    <div class="protection-badge" id="protection-badge">
      <span id="protection-icon">🔒</span>
      <span id="protection-text">Protection Active</span>
    </div>
  </div>

  <!-- Current Page Result -->
  <div class="section" id="current-section">
    <div class="section-label">Current Page</div>
    <div id="current-result" class="result-box loading">
      <div class="spinner"></div>
      <span>Analyzing…</span>
    </div>
  </div>

  <!-- Zero Trust Decision -->
  <div class="section" id="zt-section" style="display:none">
    <div class="section-label">Zero Trust Decision</div>
    <div id="zt-result" class="zt-box">
      <div class="zt-decision-row">
        <span id="zt-icon" class="zt-icon">❓</span>
        <div>
          <div id="zt-decision" class="zt-decision">—</div>
          <div id="zt-reason" class="zt-reason"></div>
        </div>
      </div>
      <div class="zt-metrics">
        <div class="zt-metric">
          <div class="zt-metric-label">Trust Score</div>
          <div id="zt-trust" class="zt-metric-value">—</div>
        </div>
        <div class="zt-metric">
          <div class="zt-metric-label">Risk Level</div>
          <div id="zt-risk" class="zt-metric-value">—</div>
        </div>
        <div class="zt-metric">
          <div class="zt-metric-label">Policy</div>
          <div id="zt-policy" class="zt-metric-value">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Scan -->
  <div class="section">
    <div class="section-label">Quick Scan</div>
    <div class="scan-row">
      <input id="scan-input" type="text" placeholder="Enter URL…" class="scan-input">
      <button id="scan-btn" class="scan-btn">Scan</button>
    </div>
    <div id="scan-result"></div>
  </div>

  <!-- Stats -->
  <div class="section">
    <div class="section-label">Session Stats</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="stat-scans">0</div>
        <div class="stat-label">Scanned</div>
      </div>
      <div class="stat-box">
        <div class="stat-num danger" id="stat-threats">0</div>
        <div class="stat-label">Threats</div>
      </div>
      <div class="stat-box">
        <div class="stat-num safe" id="stat-safe">0</div>
        <div class="stat-label">Safe</div>
      </div>
      <div class="stat-box">
        <div class="stat-num blocked" id="stat-blocked">0</div>
        <div class="stat-label">Blocked</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="popup-footer">
    <a href="http://127.0.0.1:5000/dashboard" target="_blank" id="open-dashboard">Open Dashboard →</a>
    <span id="api-status" class="api-label">API: Offline</span>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
